# estudios-nube.yml — el segundo cuerpo de la mente (investigacion labs, 12-jul-2026)
# El propio repositorio corre una campana en la nube de GitHub (gratis, 2000 min/mes)
# y commitea los resultados de vuelta. Se dispara A MANO desde la pestana Actions
# (workflow_dispatch) — el director decide cuando la nube trabaja.
name: estudios-nube

on:
  workflow_dispatch:
    inputs:
      reconstruir:
        description: "reconstruir datos publicos antes de correr (mendeley_epoca2 | caida | no) — EN LA NUBE casi siempre hace falta: datos/ esta fuera de git. 'no' solo si la carpeta ya vino en el repo."
        default: "mendeley_epoca2"
      datos:
        description: "carpeta de datos (relativa al repo)"
        default: "datos/procesados/mendeley_epoca2"
      salida:
        description: "carpeta de resultados"
        default: "resultados/nube-01"
      args:
        description: "argumentos de descubrir_pool"
        default: "--semillas 2 --paralelo 1 --suavizar 3 --retardos 2 --maxsize 25 --niter 400 --jueces 3 --nulo surrogado"

concurrency:
  group: nube
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  campana:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: guarda de datos (falla en segundos, no tras 4 min de compilar Julia)
        run: |
          if [ "${{ inputs.reconstruir }}" = "no" ] && [ ! -d "${{ inputs.datos }}" ]; then
            echo "::error::La carpeta '${{ inputs.datos }}' no existe y 'reconstruir' esta en 'no'."
            echo "::error::En la nube, datos/ esta fuera de git (politica de datos): pon 'mendeley_epoca2' o 'caida' en el campo reconstruir."
            exit 1
          fi
      - name: instalar motor
        run: |
          pip install -q numpy pandas pysr opencv-python-headless
          python -c "import numpy; from pysr import PySRRegressor; import numpy as np; m=PySRRegressor(niterations=1, progress=False, temp_equation_file=True); m.fit(np.random.rand(30,2), np.random.rand(30)); print('motor listo')"
      - name: reconstruir datos publicos (huella verificada)
        if: ${{ inputs.reconstruir != 'no' }}
        run: |
          python codigo/reconstruir_datos.py "${{ inputs.reconstruir }}"
      - name: correr campana
        run: |
          python codigo/descubrir_pool.py "${{ inputs.datos }}" "${{ inputs.salida }}" ${{ inputs.args }}
      - name: actualizar memoria, conectoma y boleta — corre AUNQUE la campana muera
        if: always()
        run: |
          python codigo/memoria.py --retro || true
          python codigo/conectoma.py || true
          python codigo/boleta.py || true
      - name: LOS DOS GUARDIANES (Regla 32 — su veredicto DECIDE a donde va el commit)
        id: guardianes
        if: always()
        run: |
          python codigo/pruebas.py
          python codigo/coherencia.py
          python codigo/auditoria_total.py
      - name: "commitear a main (SOLO si los guardianes aprobaron; incluye checkpoints)"
        if: always() && steps.guardianes.outcome == 'success'
        run: |
          git config user.name "mente-nube"
          git config user.email "mente@fisica-sin-herencia.local"
          git add -A
          git commit -m "Campana en la nube: ${{ inputs.salida }} (estudios-nube.yml)" || { echo "nada nuevo"; exit 0; }
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "push fallo, reintento $i"; sleep $((2**i))
          done
          exit 1

      - name: "CUARENTENA (los guardianes reprobaron: main NO se toca)"
        if: always() && steps.guardianes.outcome == 'failure'
        run: |
          git config user.name "mente-nube"
          git config user.email "mente@fisica-sin-herencia.local"
          RAMA="nube-cuarentena-${{ github.run_id }}"
          git checkout -b "$RAMA"
          git add -A
          git commit -m "CUARENTENA ${{ inputs.salida }}: los guardianes reprobaron" || true
          git push origin "$RAMA" || true
          echo "::error::Los guardianes REPROBARON. Resultados en la rama $RAMA; main intacto (Regla 32)."
