 G2_curiosidad:["Curiosidad","Decide dónde vale la pena mirar, por progreso de aprendizaje y no por error crudo. Así el ruido irreducible no la engaña."],
 G8_atencion:["Atención","Reparte el esfuerzo entre lo desconocido y lo controlable. No elige: reparte."],
 G10_interocepción:["Interocepción","Siente lo que le cuesta. Cuántos episodios, cuántos pasos, cuánto cómputo."],
 G10_interocepcion:["Interocepción","Siente lo que le cuesta. Cuántos episodios, cuántos pasos, cuánto cómputo."],
 G6_memoria:["Memoria","Escucha TODOS los temas y guarda. Es el único suscrito a los siete. Append-only: nada se borra jamás."],
 G9_sueno:["Sueño","Consolida en dos fases: repasa lo vivido y luego sueña. Con un guardián entre ambas — una ley soñada no pasa sin confirmarse despierto."],
 G1_prediccion:["Predicción","Modela lo que viene. Es quien cierra la ronda: pregunta a todos qué tan seguros están, y con lo que recibe arma la SÍNTESIS."],

 G11_temple:["Temple","Diseñado, sin encender. Un gen a la vez."],

};
const FASES = [
 ["cuerpo","1 · Actuar y sentir","¿Qué pasa cuando muevo?","G3_accion convoca al tema del cuerpo. Propiocepción y tacto contestan lo que sintieron; el juego decide cómo balbucear."],
 ["frontera","2 · Preguntar quién soy","¿Cuál de estos canales soy yo?","La pregunta central. Contingencia responde con los seis canales propios; poder aporta cuánto controla; los demás acusan recibo."],
 ["mundo","3 · Mirar","¿Qué veo, y qué puedo demostrar de lo que veo?","La visión habla — y lo primero que dice es lo que NO puede demostrar, citando su propia acta."],
 ["recursos","4 · Repartir el esfuerzo","¿Dónde vale la pena mirar ahora?","Interocepción dice lo que costó, poder dice cuánto controla, curiosidad pregunta y atención reparte."],
 ["descanso","5 · Consolidar","¿Qué de todo esto merece quedarse?","Memoria convoca al descanso. Sueño responde con sus dos fases y su filtro de vigilia."],
 ["revision","6 · Revisarse","¿Qué tan seguro estás de lo tuyo?","Predicción pregunta a los nueve suscritos. Contestan todos — con dato o diciendo que no tienen nada."],
];
const COLTEMA = t => getComputedStyle(document.documentElement).getPropertyValue("--"+(t||"line")).trim()||"#888";
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const ORG = Object.keys(GEN).filter(g=>GEN[g].modo!=="inactivo");
const ALT = {inactivo:0,mide:1,propone:2,decide:3};
const pos={}; 
ORG.concat(Object.keys(GEN).filter(g=>GEN[g].modo==="inactivo")).forEach((g,i,a)=>{
  const ang=(i/a.length)*Math.PI*2, r= GEN[g].modo==="inactivo"?90:215;
  pos[g]={x:Math.cos(ang)*r, z:Math.sin(ang)*r, y:ALT[GEN[g].modo]*80};
});
const lienzo=document.getElementById("lienzo"), ctx=lienzo.getContext("2d");
let W,H,DPR,yaw=-0.5,pitch=0.42,zoom=1,girar=true,vista="mapa",sel=null,t0=performance.now();
function medir(){DPR=Math.min(devicePixelRatio||1,2);const r=lienzo.parentElement.getBoundingClientRect();
  W=r.width;H=r.height;lienzo.width=W*DPR;lienzo.height=H*DPR;lienzo.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener("resize",medir);medir();

function proy(p){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const x=p.x*cy-p.z*sy, z0=p.x*sy+p.z*cy, y=p.y*cp-z0*sp, z=p.y*sp+z0*cp;
  const k=1000/(1000-z*0.5)*zoom;return{sx:W/2+x*k,sy:H/2-y*k+30,k,z};}

// los mensajes en vuelo: cada uno viaja de su causa a su emisor
const VUELOS = RONDA.ev.filter(e=>e.c!==null).map(e=>{
  const p=RONDA.ev.find(x=>x.id===e.c);
  return p?{de:p.g,a:e.g,tema:e.m||p.m,id:e.id,vacio:!!(e.d&&e.d.aporta===false)}:null;
}).filter(Boolean);
RONDA.ev.forEach(e=>(e.lk||[]).forEach(l=>{const p=RONDA.ev.find(x=>x.id===l);
  if(p)VUELOS.push({de:p.g,a:e.g,tema:e.m,id:e.id,sintesis:true});}));

function dibujar(){
  const T=(performance.now()-t0)/1000;
  ctx.clearRect(0,0,W,H);
  ["inactivo","mide","propone","decide"].forEach((m,i)=>{
    ctx.strokeStyle=css("--"+m);ctx.globalAlpha=.17;ctx.lineWidth=1;ctx.beginPath();
    for(let j=0;j<=64;j++){const a=j/64*Math.PI*2,p=proy({x:Math.cos(a)*250,y:i*80,z:Math.sin(a)*250});
      j?ctx.lineTo(p.sx,p.sy):ctx.moveTo(p.sx,p.sy);}
    ctx.stroke();
    const q=proy({x:250,y:i*80,z:0});ctx.globalAlpha=.6;ctx.fillStyle=css("--"+m);
    ctx.font="9.5px ui-monospace,monospace";ctx.fillText(m.toUpperCase(),q.sx+8,q.sy+3);ctx.globalAlpha=1;});
  // la espina
  const a0=proy({x:0,y:-12,z:0}),a1=proy({x:0,y:265,z:0});
  const gr=ctx.createLinearGradient(a0.sx,a0.sy,a1.sx,a1.sy);
  gr.addColorStop(0,css("--espina"));gr.addColorStop(1,"transparent");
  ctx.strokeStyle=gr;ctx.lineWidth=2.5;ctx.globalAlpha=.8;
  ctx.beginPath();ctx.moveTo(a0.sx,a0.sy);ctx.lineTo(a1.sx,a1.sy);ctx.stroke();ctx.globalAlpha=1;
  ctx.fillStyle=css("--ink-3");ctx.font="9px ui-monospace,monospace";
  ctx.fillText("SINAPSIS",a1.sx-22,a1.sy-10);

  const act = vista==="problema" ? Math.floor(T/2.2)%FASES.length : -1;
  const temaActivo = act>=0 ? FASES[act][0] : null;

  VUELOS.forEach((v,i)=>{
    if(!pos[v.de]||!pos[v.a])return;
    const rel = temaActivo? (v.tema===temaActivo?1:.06) : (sel? ((v.de===sel||v.a===sel)?1:.07):.34);
    if(rel<.1&&!v.sintesis)return;
    const A=proy(pos[v.de]),B=proy(pos[v.a]);
    ctx.strokeStyle=v.sintesis?css("--oro"):COLTEMA(v.tema);
    ctx.globalAlpha=rel*(v.sintesis?.5:.75);ctx.lineWidth=v.sintesis?.8:1.2;
    if(v.vacio)ctx.setLineDash([2,4]);
    ctx.beginPath();ctx.moveTo(A.sx,A.sy);
    ctx.quadraticCurveTo((A.sx+B.sx)/2,(A.sy+B.sy)/2-38,B.sx,B.sy);ctx.stroke();ctx.setLineDash([]);
    if(rel>.5&&!v.vacio){ // el paquete viajando
      const f=((T*.55+i*.11)%1), mx=(A.sx+B.sx)/2, my=(A.sy+B.sy)/2-38;
      const px=(1-f)*(1-f)*A.sx+2*(1-f)*f*mx+f*f*B.sx, py=(1-f)*(1-f)*A.sy+2*(1-f)*f*my+f*f*B.sy;
      ctx.fillStyle=v.sintesis?css("--oro"):COLTEMA(v.tema);ctx.globalAlpha=rel;
      ctx.beginPath();ctx.arc(px,py,v.sintesis?1.8:2.6,0,7);ctx.fill();}
    ctx.globalAlpha=1;});

  const pts=Object.keys(pos).map(g=>({g,p:proy(pos[g])})).sort((a,b)=>a.p.z-b.p.z);
  pts.forEach(({g,p})=>{
    const m=GEN[g].modo, act2 = temaActivo? GEN[g].esc.includes(temaActivo)||RONDA.ev.some(e=>e.g===g&&e.m===temaActivo) : true;
    const r=(m==="inactivo"?4.5:7.5)*p.k*(g===sel?1.35:1);
    ctx.globalAlpha=act2?1:.22;
    if(m==="inactivo"){ctx.strokeStyle=css("--"+m);ctx.lineWidth=1.2;ctx.setLineDash([2,3]);
      ctx.beginPath();ctx.arc(p.sx,p.sy,r,0,7);ctx.stroke();ctx.setLineDash([]);}
    else{ctx.fillStyle=css("--"+m);ctx.beginPath();ctx.arc(p.sx,p.sy,r,0,7);ctx.fill();}
    if(g===sel){ctx.strokeStyle=css("--ink");ctx.globalAlpha=.6;ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(p.sx,p.sy,r+8,0,7);ctx.stroke();}
    ctx.globalAlpha=act2?(g===sel?1:.82):.22;
    ctx.fillStyle=css("--ink");ctx.font=(g===sel?"600 ":"")+"10.5px ui-monospace,monospace";
    ctx.fillText((HACE[g]||[g])[0],p.sx+r+6,p.sy+4);ctx.globalAlpha=1;
    pos[g]._sx=p.sx;pos[g]._sy=p.sy;pos[g]._r=r+8;});
}
const lat=document.getElementById("lat");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function panelOrgano(g){
  const G=GEN[g], h=HACE[g]||[g,""];
  const emitidos=RONDA.ev.filter(e=>e.g===g);
  const recibidos=RONDA.ev.filter(e=>e.c!==null&&emitidos.some(x=>false)||false);
  const respondioA=emitidos.filter(e=>e.c!==null).map(e=>RONDA.ev.find(x=>x.id===e.c)).filter(Boolean);
  const convoco=RONDA.cx.filter(c=>c[0]===g);
  const leRespondieron=RONDA.cx.filter(c=>c[1]===g);
  return `<section>
    <p class="eyebrow">El órgano</p>
    <h2>${esc(h[0])}</h2>
    <div class="modo" style="color:var(--${G.modo})">${esc(g)} · ${G.modo}</div>
    <p class="hace">${esc(h[1]||"")}</p>
    <dl>
      <dt>Sabe hacer</dt><dd>${(G.comp.length?G.comp:["—"]).map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</dd>
      <dt>Escucha</dt><dd>${(G.esc.length?G.esc:["nada"]).map(t=>`<span class="chip" style="color:var(--${t})">${esc(t)}</span>`).join("")}</dd>
      <dt>Habló</dt><dd>${emitidos.length} veces</dd>
      <dt>Llegó a</dt><dd>${convoco.length} órganos</dd>
      <dt>Le contestaron</dt><dd>${leRespondieron.length}</dd>
    </dl>
  </section>
  <section><p class="eyebrow">Lo que dijo en esta ronda</p>
  ${emitidos.length?emitidos.map(e=>{
    const vac=e.d&&e.d.aporta===false;
    return `<div class="msg" style="border-color:var(--${e.m||'line'})">
      <div class="cab"><span>${esc(e.t)}</span><span style="color:var(--${e.m||'ink-3'})">#${esc(e.m||"—")}</span>
      ${e.c!==null?`<span>↩ al ${e.c}</span>`:""}${e.lk&&e.lk.length?`<span>⇢ enlaza ${e.lk.length}</span>`:""}</div>
      <div class="cuerpo ${vac?"vacio":""}">${esc(JSON.stringify(e.d).slice(0,230))}</div></div>`;}).join("")
    :'<p class="hace vacio">No habló en esta ronda.</p>'}
  </section>`;
}
function panelMapa(){
  const porModo=m=>Object.keys(GEN).filter(g=>GEN[g].modo===m);
  return `<section>
    <p class="eyebrow">Cómo leer esto</p>
    <p class="hace"><b>La altura es la autoridad.</b> Un órgano sube de estrato solo con un prerregistro firmado, y <code>sinapsis.py</code> lo impone en cada mensaje: los que <b>miden</b> pueden responder, pero no convocar. La autoridad para llamar a los demás viene con la autoridad para decidir.</p>
    <p class="hace"><b>El eje central es la sinapsis</b> — el único canal. Las curvas de colores son los mensajes reales de una ronda; su color es el tema. Las líneas punteadas son acuses de recibo: un órgano diciendo que no tiene nada que aportar. Las doradas son los aportes a la síntesis final.</p>
    <p class="hace"><b>Nadie habla con todos.</b> Cada órgano solo recibe los temas que declara escuchar. Conectar todo con todo no haría a Diego más listo — propagaría sus errores con la misma eficacia que sus aciertos, y borraría el rastro de quién causó qué.</p>
  </section>
  <section><p class="eyebrow">Los cuatro estratos</p>
  ${["decide","propone","mide","inactivo"].map(m=>`<dl style="margin-bottom:6px">
    <dt style="color:var(--${m})">${m}</dt><dd>${porModo(m).map(g=>esc((HACE[g]||[g])[0])).join(", ")||"—"}</dd></dl>`).join("")}
  </section>
  <section><p class="eyebrow">Los siete temas</p>
  <p class="hace">${["cuerpo","mundo","frontera","leyes","recursos","descanso","revision"].map(t=>
    `<span class="chip" style="color:var(--${t})">${t} · ${Object.keys(GEN).filter(g=>GEN[g].esc.includes(t)).length}</span>`).join(" ")}</p>
  <p class="hace" style="color:var(--ink-2)">El número es cuántos órganos escuchan ese tema. Ninguno queda en cero: un tema sin oyentes sería un nervio tendido a ninguna parte, y el trazador lo marca como error de diseño.</p>
  </section>
  <section><p class="eyebrow">Clic en cualquier órgano</p>
  <p class="hace" style="color:var(--ink-2)">Para ver qué hace, qué escucha, qué dijo en esta ronda y a quién llegó.</p></section>`;
}
function panelProblema(){
  const sint=RONDA.ev.find(e=>e.lk&&e.lk.length);
  const d=sint?sint.d:{};
  return `<section>
    <p class="eyebrow">El problema de esta ronda</p>
    <h2 class="serif">¿Cuál de estas señales soy yo?</h2>
    <p class="hace">Diego recibe cuatro episodios en su Gimnasio y nueve canales sensoriales mezclados: ángulos, velocidades, contactos. Nadie le dice cuáles son su cuerpo. Tiene que averiguarlo — y para eso pasa por seis fases, convocando en cada una a los órganos que le hacen falta.</p>
  </section>
  <section><p class="eyebrow">Las seis fases</p><div class="fases">
  ${FASES.map(([tema,tit,q,txt])=>{
    const ev=RONDA.ev.filter(e=>e.m===tema);
    const quien=[...new Set(ev.map(e=>(HACE[e.g]||[e.g])[0]))];
    return `<div class="fase" style="color:var(--${tema});border-color:var(--${tema})">
      <h3 style="color:var(--ink)">${esc(tit)}</h3>
      <p class="q">${esc(q)}</p>
      <p class="hace" style="margin:0 0 6px">${esc(txt)}</p>
      <p class="quien">${ev.length} mensajes · ${quien.map(esc).join(" · ")}</p></div>`;}).join("")}
  </div></section>
  <section><p class="eyebrow">La respuesta que Diego arma</p>
  <div class="veredicto">
    <h3>Síntesis</h3>
    <dl>
      <dt>Voces</dt><dd>${d.voces||"—"}</dd>
      <dt>Testigos independientes</dt><dd>${d.testigos_independientes||"—"}</dd>
      <dt>Aportes enlazados</dt><dd>${sint?sint.lk.length:0}</dd>
      <dt>Acuses sin dato</dt><dd>${d.aportes_vacios!=null?d.aportes_vacios:"—"}</dd>
    </dl>
    <p class="hace" style="margin:14px 0 4px"><b>Lo que afirma:</b> los seis canales de propiocepción son suyos. Los halló por contingencia, no porque nadie se lo dijera.</p>
    <p class="eyebrow" style="margin:14px 0 6px">Lo que NO afirma</p>
    ${(d.lo_que_NO_se_afirma||[]).map(x=>`<p class="noafirma">${esc(x)}</p>`).join("")}
    <p class="hace" style="margin-top:14px;color:var(--ink-2)">Una síntesis que siempre concluye algo es un blanqueador de evidencia, no una mente. Ésta cuenta <b>testigos independientes</b>, no voces — ocho órganos repitiendo a un noveno son un testigo, no ocho — y tiene permitido decir <b>no sé</b>.</p>
  </div></section>`;
}
function pintarLat(){lat.innerHTML = sel?panelOrgano(sel):(vista==="mapa"?panelMapa():panelProblema());
  lat.scrollTop=0;}
pintarLat();

let arr=false,lx=0,ly=0,movio=false;
lienzo.addEventListener("pointerdown",e=>{arr=true;movio=false;girar=false;lx=e.clientX;ly=e.clientY;
  lienzo.classList.add("arr");document.getElementById("ayuda").style.opacity=0;});
addEventListener("pointerup",e=>{
  if(arr&&!movio){const r=lienzo.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    let c=null,dm=1e9;Object.keys(pos).forEach(g=>{const d=Math.hypot(pos[g]._sx-mx,pos[g]._sy-my);
      if(d<pos[g]._r+12&&d<dm){dm=d;c=g;}});
    sel=(c===sel)?null:c;pintarLat();}
  arr=false;lienzo.classList.remove("arr");});
addEventListener("pointermove",e=>{if(!arr)return;
  if(Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly)>3)movio=true;
  yaw+=(e.clientX-lx)*.006;pitch=Math.max(-.2,Math.min(1.1,pitch+(e.clientY-ly)*.004));
  lx=e.clientX;ly=e.clientY;});
lienzo.addEventListener("wheel",e=>{e.preventDefault();
  zoom=Math.max(.6,Math.min(2.2,zoom*(e.deltaY>0?.93:1.075)));},{passive:false});
document.querySelectorAll(".pestanas button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".pestanas button").forEach(x=>x.setAttribute("aria-selected",x===b));
  vista=b.dataset.v;sel=null;t0=performance.now();pintarLat();
  document.getElementById("sub").textContent = vista==="mapa"
    ? "16 órganos · 34 mensajes · 50 conexiones reales de una ronda"
    : "el problema recorre seis fases y termina en una síntesis que sabe lo que no sabe";}));
const lento=matchMedia("(prefers-reduced-motion:reduce)").matches;
(function bucle(){if(girar&&!lento&&vista==="mapa")yaw+=.0018;dibujar();requestAnimationFrame(bucle);})();
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",dibujar);
</script>
